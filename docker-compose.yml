services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sidequest
      POSTGRES_PASSWORD: sidequest
      POSTGRES_DB: sidequest
    ports:
      - '5432:5432'
    volumes:
      - sidequest-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - sidequest-redis:/data

  # S3-compatible mock for local dev/test. The app talks to it through the
  # same AWS SDK client used against real S3 in production — only the
  # endpoint/credentials env vars differ. See .env.example.
  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - sidequest-localstack:/var/lib/localstack

volumes:
  sidequest-postgres:
  sidequest-redis:
  sidequest-localstack:
